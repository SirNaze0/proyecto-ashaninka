# Configuración para usar noticias-ashaninka como repositorio independiente. Dentro de Proyecto
# se usa la de la raíz (Proyecto/.pre-commit-config.yaml).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: scripts/venv_exec.sh ruff check
        language: system
        types: [python]
      - id: ruff-format-check
        name: ruff format (check)
        entry: scripts/venv_exec.sh ruff format --check
        language: system
        types: [python]
      - id: shellcheck
        name: shellcheck
        entry: scripts/venv_exec.sh shellcheck
        language: system
        types: [shell]
