[project]
name = "noticias-ashaninka"
version = "0.1.0"
description = "Servicio web de noticias en asháninka con síntesis de voz, texto y avatar (artefacto de tesis)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "num2words>=0.5.13",
    "python-dotenv>=1.0",
    # Fase 2: la síntesis de voz es parte central del servicio
    "numpy>=1.26",
    "soundfile>=0.12",
    "torch>=2.4",
    "transformers>=4.44",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "shellcheck-py>=0.10",
    "psutil>=5.9",
]
# Evaluación (métricas auxiliares). torch/transformers ya son dependencias principales.
eval = [
    "jiwer>=3.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "eval"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "smoke: subconjunto rápido (< 30 s) que ejecuta init.sh",
    "corpus: requiere el corpus AmericasNLP descargado en data/corpus/",
    "eval: requiere el grupo de dependencias eval (torch, transformers)",
]
addopts = "-ra"
pythonpath = ["backend/tests"]

[tool.coverage.run]
source = ["backend/app/pipeline", "backend/app/corpus", "backend/app/batch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: el formateador controla el largo del código; los textos largos en castellano se permiten.
# B008: Depends() en argumentos por defecto es el patrón idiomático de FastAPI.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# SQLModel necesita Optional["X"] en las relaciones (no admite anotaciones diferidas)
"backend/app/db/models.py" = ["UP045", "UP037"]
